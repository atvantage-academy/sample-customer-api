# =============================================================================
# Swagger UI fuer ALLE Staende -> GitHub Pages
# -----------------------------------------------------------------------------
# Die Musterloesung liegt in mehreren Staenden: `main` traegt den Kern, die
# Branches `01-…` bis `04-…` je ein weiterfuehrendes Thema. Dieser Workflow
# sammelt aus jedem Branch die `openapi.yaml` ein und veroeffentlicht sie
# zusammen mit EINER Swagger UI, in der oben links umgeschaltet wird.
#
# BEWUSST NICHT IM REPOSITORY: Frueher lag die entpackte Swagger UI als rund
# 20 Dateien im Repo (eigener Branch). Das hatte drei Nachteile - die Fassung
# veraltete still, jede Aktualisierung war ein Commit mit Megabytes an Diff, und
# niemand konnte auf einen Blick sehen, welche Version eigentlich ausgeliefert
# wird. Hier steht sie als PIN in einer Zeile (SWAGGER_UI_VERSION) und wird zur
# Build-Zeit geladen.
#
# DIE OBERFLAECHE steht dagegen als richtige Datei im Repo, unter `web/`. Sie
# laesst sich dadurch lokal ansehen und in einem Diff lesen - anders als frueher,
# als die index.html in einem Here-Dokument in dieser Datei stand.
#
# Voraussetzung (einmalig): Settings -> Pages -> Source: "GitHub Actions".
# =============================================================================
name: Swagger UI

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Ein Stand wurde geaendert: `OpenAPI pruefen` ist dort durchgelaufen, und
  # dieser Lauf haengt sich daran. Er laeuft im Kontext des Standard-Branches
  # und darf deshalb veroeffentlichen (siehe Kommentar in spec-check.yml).
  workflow_run:
    workflows: ["OpenAPI pruefen"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Laeuft ein Deploy, wartet der naechste - aber ein laufender wird nicht
# abgebrochen, sonst steht die Seite kurzzeitig auf einem halben Stand.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SWAGGER_UI_VERSION: 5.32.15
  # Welche Branches ein Stand sind. `main` und zweistellig nummerierte
  # Branches - alles andere (Feature-Branches, Experimente) bleibt draussen.
  STAND_PATTERN: '^(main|[0-9]{2}-[a-z0-9-]+)$'

jobs:

  build:
    # Bei `workflow_run` nur weitermachen, wenn die Pruefung sauber war UND auf
    # einem Stand lief. `main` ist ausgenommen, weil dort schon der Push-Ausloeser
    # baut; Feature-Branches sind ausgenommen, weil sie am Ergebnis nichts aendern
    # wuerden - veroeffentlicht werden nur `main` und die nummerierten Staende.
    # Ausdruecke koennen hier kein Muster pruefen, deshalb das schlichte `0` am
    # Anfang: Es trifft 01 bis 09 und sonst nichts.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, '0'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Vollstaendig, weil die uebrigen Staende aus den anderen Branches
          # gelesen werden. Ohne das gibt es nur den einen Checkout.
          fetch-depth: 0

      - name: Redocly bereitstellen
        run: npm install --global @redocly/cli@1

      - name: Staende einsammeln und pruefen
        run: |
          set -euo pipefail
          mkdir -p site/specs
          : > entries.ndjson

          # Alle Branches, die dem Muster entsprechen: `main` zuerst, danach die
          # nummerierten aufsteigend - das ist die Reihenfolge, in der der Kurs
          # sie aufbaut, und die Reihenfolge im Auswahlfeld.
          all=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
                | sed 's|^origin/||' | grep -Ev '^HEAD$' | sort -u)
          staende=$( { echo "$all" | grep -Ex 'main' || true; \
                       echo "$all" | grep -Ex '[0-9]{2}-[a-z0-9-]+' | sort || true; } )

          echo "Gefundene Staende:"; echo "$staende" | sed 's/^/  - /'

          for branch in $staende; do
            if ! git cat-file -e "origin/$branch:openapi.yaml" 2>/dev/null; then
              echo "::warning::Branch $branch hat keine openapi.yaml - uebersprungen."
              continue
            fi

            echo "::group::Stand $branch"
            # In ein eigenes Verzeichnis auspacken, damit der Checkout unberuehrt
            # bleibt - und damit `redocly` die redocly.yaml DIESES Standes sieht.
            mkdir -p "work/$branch"
            git archive "origin/$branch" | tar -x -C "work/$branch"

            ( cd "work/$branch" && redocly lint openapi.yaml --format stylish )

            # Fuer die Beschriftung im Auswahlfeld: Jeder Stand benennt sich
            # selbst in `info.x-stand-label` und `info.summary`. Gebuendelt wird
            # nur, um die beiden Felder zuverlaessig auslesen zu koennen - im
            # Netz landet die YAML-Fassung, die man auch lesen will.
            redocly bundle "work/$branch/openapi.yaml" \
              --output "work/$branch/bundle.json" --ext json > /dev/null

            label=$(jq -r '.info["x-stand-label"] // empty' "work/$branch/bundle.json")
            summary=$(jq -r '.info.summary // empty' "work/$branch/bundle.json")

            mkdir -p "site/specs/$branch"
            cp "work/$branch/openapi.yaml" "site/specs/$branch/openapi.yaml"

            jq -nc \
              --arg branch  "$branch" \
              --arg label   "${label:-$branch}" \
              --arg summary "$summary" \
              --arg url     "specs/$branch/openapi.yaml" \
              '{branch:$branch,label:$label,summary:$summary,url:$url}' >> entries.ndjson
            echo "::endgroup::"
          done

          jq -s --arg repo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            '{repository:$repo, specs:.}' entries.ndjson > site/specs.json
          cat site/specs.json

      - name: Swagger UI holen und Site zusammenstellen
        run: |
          set -euo pipefail
          npm pack --silent --pack-destination /tmp "swagger-ui-dist@${SWAGGER_UI_VERSION}" > /tmp/tgz.txt
          tar -xzf "/tmp/$(cat /tmp/tgz.txt)" -C /tmp
          # swagger-ui-standalone-preset.js wird NICHT kopiert: Es liefert
          # ausschliesslich die mitgelieferte Topbar (SmartBear-Logo + Eingabefeld
          # fuer eine beliebige andere Beschreibung). Unsere Leiste steht in
          # web/ - und spart rund 300 KB Uebertragung.
          # Die Favicons von swagger-ui-dist ebenfalls nicht: Das ist eine
          # fremde Marke. web/favicon.svg tritt an ihre Stelle.
          cp /tmp/package/swagger-ui.css \
             /tmp/package/swagger-ui-bundle.js \
             /tmp/package/oauth2-redirect.html \
             site/
          cp web/index.html web/topbar.css web/topbar.js \
             web/logo-atvantage.svg web/favicon.svg site/
          cp README.md site/
          cp -r docs site/docs

      - name: Ergebnis pruefen
        run: |
          set -euo pipefail
          test -s site/index.html     || { echo "FEHLER: index.html fehlt oder ist leer"; exit 1; }
          test -s site/topbar.js      || { echo "FEHLER: topbar.js fehlt";                exit 1; }
          test -s site/swagger-ui.css || { echo "FEHLER: Swagger UI fehlt";               exit 1; }
          test -s site/specs.json     || { echo "FEHLER: specs.json fehlt";               exit 1; }
          anzahl=$(jq '.specs | length' site/specs.json)
          test "$anzahl" -ge 1 || { echo "FEHLER: kein einziger Stand gefunden"; exit 1; }
          jq -e '.specs[] | select(.branch == "main")' site/specs.json > /dev/null \
            || { echo "FEHLER: der Stand main fehlt"; exit 1; }
          echo "Site: $(find site -type f | wc -l) Dateien, $anzahl Staende"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
