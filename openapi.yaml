# Musterlösung zum Training „REST APIs – Grundlagen und Design“
# der ATVANTAGE Academy. Der formlose Entwurf, aus dem dieses Dokument
# entstanden ist, liegt unter docs/design.md – dort stehen auch die
# Alternativen, die im Kurs zur Diskussion standen.
#
# DIES IST DER STAND `04-autorisierung`: `03-hypermedia-hal` plus OAuth 2,
# Scopes und die Antworten 401 und 403. Der letzte Stand - hier ist die
# API vollständig. Diff: `git diff 03-hypermedia-hal..04-autorisierung`.
openapi: 3.1.0

info:
  title: Account Service API
  # Beschriftung und Kurztext fuer das Auswahlfeld der Swagger UI.
  # Jeder Stand benennt sich hier selbst - die Pipeline liest beides aus.
  x-stand-label: '04 · Autorisierung'
  summary: OAuth 2 und Scopes – und der Unterschied zwischen 401 und 403.
  description: |
    Verwaltung der Kundenkonten eines Online-Shops.

    **Musterlösung zur Entwurfsübung** aus dem Training „REST APIs – Grundlagen
    und Design“ der ATVANTAGE Academy – **eine** mögliche Lösung, nicht die
    einzige richtige. An mehreren Stellen wäre eine andere Modellierung ebenso
    vertretbar; die Begründungen stehen im
    [formlosen Entwurf](https://github.com/atvantage-academy/sample-customer-api/blob/main/docs/design.md).

    ### Dies ist der Stand `04-autorisierung`

    Der **letzte** Stand: Hier ist die API vollständig. Er baut auf
    `03-hypermedia-hal` auf und ergänzt, wer was darf – **OAuth 2** mit vier
    Scopes, und an jeder Operation die Antworten `401` und `403`.

    **Der Unterschied, der im Kurs zuverlässig durcheinandergeht:**

    | Code | Heißt | Hilft ein zweiter Versuch? |
    | ---- | ----- | -------------------------- |
    | `401` Unauthorized | *Ich weiß nicht, wer Du bist.* Kein Token, abgelaufen, ungültig. | Ja – mit gültigem Token. |
    | `403` Forbidden | *Ich weiß, wer Du bist, und Du darfst das nicht.* | Nein – nicht mit diesem Token. |

    `401` ist eine Frage nach dem Ausweis, `403` eine Ablehnung trotz Ausweis.
    Der Name von `401` ist historisch falsch: Gemeint ist *unauthenticated*.

    **Die Scopes sind grob geschnitten** – lesen, schreiben, Bezahldaten, Sperren.
    Genau deshalb liegen die Bezahldaten als eigene Subressourcen und nicht als
    Felder des Kunden: Eine Berechtigung auf **Feldebene** kann HTTP nicht
    ausdrücken, eine auf Ressourcenebene schon.

    **Im Kurs nicht behandelt.** Authentifizierung und Autorisierung erledigt
    üblicherweise das API Gateway *vor* dem Service. Hier stehen sie, damit die
    Beschreibung vollständig ist und man sieht, welche Berechtigung welche
    Operation verlangt – „API Security“ ist ein eigener Kurs.

    Oben links lässt sich zwischen den Ständen umschalten:

    | Stand | Was dazukommt |
    | ----- | ------------- |
    | `main` | Der Kern: Ressourcen, Methoden, Statuscodes, Schemas |
    | `01-paginierung` | Cursorbasiertes Blättern über die Kundenliste |
    | `02-problem-details` | Fehlerformat nach RFC 9457 statt eines eigenen |
    | `03-hypermedia-hal` | HAL: die Antwort trägt ihre nächsten Schritte mit |

    Hinter den Adressen steht **kein Server** – dies ist ein Entwurf, keine
    laufende API. „Try it out“ ist deshalb abgeschaltet.

    Quelle: [github.com/atvantage-academy/sample-customer-api](https://github.com/atvantage-academy/sample-customer-api)
  version: 1.0.0
  contact:
    name: ATVANTAGE Academy
    email: academy@atvantage.com

servers:
  - url: https://api.example.com/v1
    description: Produktion
  - url: https://api.test.example.com/v1
    description: Testumgebung

# Standard für alle Operationen: lesender Zugriff. Wer mehr braucht, verschärft
# das an der Operation selbst – so steht an jeder Stelle nur die Abweichung.
security:
  - openId: [reader_access]

tags:
  - name: customers
    description: Kundenkonten anlegen, lesen, ändern und löschen
  - name: address
    description: Die Anschrift eines Kunden
  - name: payments
    description: Bezahldaten – bewusst getrennt vom Kunden, weil anders geschützt
  - name: flags
    description: |
      Schalter am Kundenkonto: die Deaktivierung und die Sperre. Aus ihnen
      ergibt sich der Zustand, den `Customer.state` anzeigt.

paths:

  /customers:
    get:
      tags: [customers]
      operationId: readCustomers
      summary: Alle Kunden lesen
      description: |
        Liefert die Kunden **seitenweise**, und zwar cursorbasiert: Der Client
        fragt nicht nach „Seite 7“, sondern nach dem, was **hinter diesem
        Zeiger** kommt. Ohne `cursor` beginnt die Liste von vorn.

        Es gibt **keine Antwort ohne Grenze**. Fehlt `limit`, gilt die Vorgabe;
        über die Obergrenze kommt niemand hinaus. Das ist der eigentliche Punkt
        der Paginierung – nicht die Bequemlichkeit, sondern der Schutz.

        **Ohne Bezahldaten** – die liegen als eigene Subressourcen, weil sie
        anders geschützt werden müssen.
      parameters:
        - name: state
          in: query
          description: Nur Kunden in diesem Zustand
          schema:
            $ref: '#/components/schemas/CustomerState'
        - name: cursor
          in: query
          description: |
            Der Zeiger auf die Fortsetzung – wörtlich das, was in `nextCursor`
            der vorigen Antwort stand. Fehlt er, beginnt die Liste von vorn.

            **Undurchsichtig, mit Absicht:** Wer ihn auseinandernimmt und daraus
            eine Kennung oder einen Zeitstempel liest, baut auf etwas, das sich
            jederzeit ändern darf. Er wird weitergereicht, nicht interpretiert.
          schema:
            type: string
            maxLength: 512
            examples: ['eyJhZnRlciI6IjNmYTg1ZjY0In0']
        - name: limit
          in: query
          description: |
            Wie viele Einträge höchstens zurückkommen. Die Antwort darf
            **weniger** liefern, ohne dass die Liste zu Ende ist – ob es
            weitergeht, sagt allein `nextCursor`.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Die Seite wurde gelesen
          content:
            # HAL ZUERST, und das ist Absicht: Swagger UI zeigt den ersten
            # Medientyp. Dieser Stand handelt von Hypermedia - die `_links`
            # sollen sichtbar sein, ohne dass jemand erst umschaltet. Die
            # gewohnte Darstellung ist einen Klick entfernt, nicht weg.
            application/hal+json:
              schema:
                $ref: '#/components/schemas/HalCustomerCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        '400':
          description: |
            Ungültiger Parameter – etwa ein `limit` außerhalb der Grenzen oder
            ein `cursor`, der nicht mehr gilt. Ein Zeiger kann **ablaufen**; der
            Aufrufer beginnt dann von vorn.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [customers]
      operationId: createCustomer
      summary: Einen Kunden anlegen
      description: |
        Die Kennung vergibt der **Server**. Deshalb POST und nicht PUT – und
        deshalb ist die Operation nicht idempotent: Zweimal gesendet heißt zwei
        Kunden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      security:
        - openId: [writer_access]
      responses:
        '201':
          description: Der Kunde wurde angelegt
          headers:
            Location:
              description: Adresse des neuen Kunden
              schema:
                type: string
                format: uri-reference
                examples: ['/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6']
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/HalCustomer'
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /customers/{id}:
    get:
      tags: [customers]
      operationId: readCustomer
      summary: Einen Kunden lesen
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          description: Der Kunde wurde gefunden
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/HalCustomer'
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [customers]
      operationId: replaceCustomer
      summary: Einen Kunden ersetzen
      description: |
        **Ersetzt den Datensatz vollständig.** Felder, die nicht mitgeschickt
        werden, sind danach leer. Für Teiländerungen `PATCH` verwenden.
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      security:
        - openId: [writer_access]
      responses:
        '200':
          description: Der Kunde wurde ersetzt
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/HalCustomer'
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [customers]
      operationId: updateCustomer
      summary: Einzelne Felder eines Kunden ändern
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
      security:
        - openId: [writer_access]
      responses:
        '204':
          description: Die Änderung wurde übernommen
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [customers]
      operationId: deleteCustomer
      summary: Einen Kunden löschen
      description: |
        Idempotent: Beim zweiten Aufruf ist der Kunde immer noch weg. Diese API
        antwortet dann `404` – der Zustand ist derselbe, nur die Antwort
        unterscheidet sich.
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      security:
        - openId: [writer_access]
      responses:
        '204':
          description: Der Kunde wurde gelöscht
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/{id}/address:
    get:
      tags: [address]
      operationId: readAddress
      summary: Die Anschrift lesen
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          description: Die Anschrift wurde gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Kunde unbekannt oder ohne hinterlegte Anschrift
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    put:
      tags: [address]
      operationId: replaceAddress
      summary: Die Anschrift setzen oder ersetzen
      description: |
        Es gibt genau **eine** Anschrift, und der Client kennt ihren Inhalt
        vollständig – deshalb PUT. Zweimal gesendet ändert nichts.
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      security:
        - openId: [writer_access]
      responses:
        '204':
          description: Die Anschrift wurde gesetzt
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/{id}/payments:
    get:
      tags: [payments]
      operationId: readPayments
      summary: Alle hinterlegten Bezahldaten lesen
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      security:
        - openId: [payment_access]
      responses:
        '200':
          description: Die Bezahldaten wurden gelesen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/{id}/payments/paypal:
    get:
      tags: [payments]
      operationId: readPayPal
      summary: Die PayPal-Daten lesen
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      security:
        - openId: [payment_access]
      responses:
        '200':
          description: Die PayPal-Daten wurden gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Kunde unbekannt oder ohne PayPal-Daten
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags: [payments]
      operationId: replacePayPal
      summary: Die PayPal-Daten setzen oder ersetzen
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayPal'
      security:
        - openId: [payment_access]
      responses:
        '204':
          description: Die PayPal-Daten wurden gesetzt
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [payments]
      operationId: deletePayPal
      summary: Die PayPal-Daten entfernen
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      security:
        - openId: [payment_access]
      responses:
        '204':
          description: Die PayPal-Daten wurden entfernt
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/{id}/payments/creditcard:
    get:
      tags: [payments]
      operationId: readCreditCard
      summary: Die Kreditkartendaten lesen
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      security:
        - openId: [payment_access]
      responses:
        '200':
          description: Die Kreditkartendaten wurden gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Kunde unbekannt oder ohne Kreditkartendaten
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags: [payments]
      operationId: replaceCreditCard
      summary: Die Kreditkartendaten setzen oder ersetzen
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCard'
      security:
        - openId: [payment_access]
      responses:
        '204':
          description: Die Kreditkartendaten wurden gesetzt
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [payments]
      operationId: deleteCreditCard
      summary: Die Kreditkartendaten entfernen
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      security:
        - openId: [payment_access]
      responses:
        '204':
          description: Die Kreditkartendaten wurden entfernt
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/{id}/flags/deactivation:
    description: |
      Der Deaktivierungs-Schalter. Gesetzt = der Kunde hat sein Konto stillgelegt.

      Bewusst als Schalter und nicht als Aktion modelliert: So sind Deaktivieren
      und Aktivieren **idempotent** und der Zustand ist einzeln abfragbar. Die
      Alternativen (Statusfeld per PATCH, Aktivitätsressource per POST) stehen
      samt Begründung in `docs/design.md`.
    get:
      tags: [flags]
      operationId: readDeactivationFlag
      summary: Ist das Konto deaktiviert?
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          description: Der Schalter ist gesetzt – das Konto ist deaktiviert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivationFlag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Kunde unbekannt, oder der Schalter ist nicht gesetzt
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags: [flags]
      operationId: setDeactivationFlag
      summary: Das Konto deaktivieren
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivationFlag'
      security:
        - openId: [writer_access]
      responses:
        '204':
          description: Das Konto ist deaktiviert – auch wenn es das vorher schon war
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Das Konto ist **gesperrt**. Eine Sperre ist stärker als eine
            Deaktivierung und lässt sich nicht von ihr überschreiben.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [flags]
      operationId: clearDeactivationFlag
      summary: Das Konto wieder aktivieren
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      security:
        - openId: [writer_access]
      responses:
        '204':
          description: Das Konto ist nicht mehr deaktiviert – auch wenn es das vorher schon nicht war
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/{id}/flags/lock:
    description: |
      Der Sperr-Schalter. Gesetzt = das Konto ist gesperrt.

      **Warum ein zweiter Schalter und kein zweiter Wert im selben?** Weil es
      zwei verschiedene Vorgänge sind, die verschiedene Leute auslösen: Die
      Deaktivierung veranlasst der Kunde, die Sperre der Betreiber. Beide können
      gleichzeitig gelten, und die Sperre hat Vorrang – `Customer.state` zeigt
      dann `gesperrt`.
    get:
      tags: [flags]
      operationId: readLockFlag
      summary: Ist das Konto gesperrt?
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      responses:
        '200':
          description: Der Schalter ist gesetzt – das Konto ist gesperrt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockFlag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Kunde unbekannt, oder der Schalter ist nicht gesetzt
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags: [flags]
      operationId: setLockFlag
      summary: Das Konto sperren
      description: |
        Geht aus **jedem** Zustand – ein deaktiviertes Konto darf ebenso gesperrt
        werden wie ein aktives.
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockFlag'
      security:
        - openId: [lock_access]
      responses:
        '204':
          description: Das Konto ist gesperrt – auch wenn es das vorher schon war
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [flags]
      operationId: clearLockFlag
      summary: Die Sperre aufheben
      description: |
        Hebt **nur** die Sperre auf. War das Konto vorher zusätzlich deaktiviert,
        ist es danach deaktiviert und nicht aktiv.
      # Gehoerte eigentlich auf Pfadebene - Swagger UI loest dort bei
      # OpenAPI 3.1 kein $ref auf. Begruendung: components/parameters.
      parameters:
        - $ref: '#/components/parameters/customerId'
      security:
        - openId: [lock_access]
      responses:
        '204':
          description: Die Sperre ist aufgehoben – auch wenn es keine gab
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:

  parameters:
    # WARUM DIESER PARAMETER AN JEDER OPERATION STEHT UND NICHT AM PFAD
    #
    # Richtig waere die Pfadebene: Ein `parameters`-Block direkt unter
    # `/customers/{id}` gilt fuer ALLE Methoden darunter, und die Kennung ist
    # bei GET, PUT, PATCH und DELETE dieselbe. So stuende sie einmal statt
    # viermal.
    #
    # Swagger UI rendert das bei OpenAPI 3.1 falsch: Ein $ref in den
    # `parameters` AUF PFADEBENE wird nicht aufgeloest, die Oberflaeche zeigt
    # statt Name und Typ nur "any". Mit `openapi: 3.0.3` funktioniert dasselbe
    # Dokument, und auf Operationsebene funktioniert der $ref auch unter 3.1 -
    # geprueft mit swagger-ui-dist 5.32 und 5.33.
    #
    # Deshalb steht der $ref hier an jeder Operation. Das ist ein Zugestaendnis
    # an ein Werkzeug, keine Entwurfsentscheidung - und ein Beleg fuer den Satz
    # aus dem Kursmodul: Manche Werkzeuge hinken bei 3.1 hinterher, das prueft
    # man VOR der Festlegung. Wer dieses Dokument in einem anderen Werkzeug
    # weiterverwendet, darf die Bloecke wieder auf die Pfadebene ziehen.
    customerId:
      name: id
      in: path
      required: true
      description: Die Kennung des Kunden
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Die Anfrage ist nicht gültig
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    Unauthorized:
      description: |
        **Nicht authentifiziert** – es fehlt ein gültiges Token. Der Name des
        Codes ist historisch falsch: Gemeint ist *unauthenticated*.

        Mit einem gültigen Token kann derselbe Aufruf gelingen.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        **Authentifiziert, aber nicht berechtigt** – das Token reicht für diese
        Operation nicht.

        Ein zweiter Versuch mit demselben Token bringt nichts. Das ist der ganze
        Unterschied zu `401`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Diese Ressource gibt es nicht
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    CustomerState:
      type: string
      description: |
        Der Zustand eines Kundenkontos. **Ergibt sich aus den Schaltern** unter
        `/customers/{id}/flags` und wird nicht direkt gesetzt: Sperre gesetzt →
        `gesperrt`, sonst Deaktivierung gesetzt → `deaktiviert`, sonst `aktiv`.
      enum: [aktiv, deaktiviert, gesperrt]

    Customer:
      type: object
      required: [name, birthdate]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: |
            Vom Server vergeben und unveränderlich. `readOnly` heißt: kommt beim
            Lesen mit, wird beim Anlegen nicht mitgeschickt – deshalb braucht es
            kein zweites Schema.
        name:
          type: string
          minLength: 3
          maxLength: 100
          examples: ['Tom Mayer']
        birthdate:
          type: string
          format: date
          examples: ['1985-07-14']
        state:
          allOf:
            - $ref: '#/components/schemas/CustomerState'
          readOnly: true
          description: |
            Nur lesbar. Geändert wird der Zustand über die Schalter unter
            `/customers/{id}/flags/…`.

    CustomerPatch:
      type: object
      description: Nur die Felder, die geändert werden sollen
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        birthdate:
          type: string
          format: date

    CustomerList:
      type: object
      description: |
        **Ein Objekt, kein nacktes Array.** Genau deshalb war dieser Stand
        möglich: `nextCursor` ist ein neues Feld in einem bestehenden Objekt –
        kein einziger Aufrufer von `main` bricht daran. Wäre die Antwort ein
        nacktes Array gewesen, hätte die Paginierung sie ersetzen müssen.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Die Kunden dieser Seite, in stabiler Reihenfolge
          items:
            $ref: '#/components/schemas/Customer'
        nextCursor:
          type: [string, 'null']
          description: |
            Der Zeiger auf die nächste Seite – als `cursor` in die nächste
            Anfrage. **`null` heißt: Das war die letzte Seite.**

            Bewusst **keine** Gesamtzahl daneben: Sie kostet bei großen Beständen
            eine zweite, teure Abfrage, und sie stimmt ohnehin nur für einen
            Augenblick. Wer sie braucht, soll sie anfordern müssen.
          examples: ['eyJhZnRlciI6IjNmYTg1ZjY0In0', null]

    Link:
      type: object
      description: |
        Ein Verweis nach **HAL** (RFC-Entwurf *JSON Hypertext Application
        Language*). Mehr als eine Adresse ist das nicht – **insbesondere keine
        Methode.** Was mit dem Verweis zu tun ist, sagt die Beziehung, unter der
        er steht, und diese Beschreibung hier.
      required: [href]
      properties:
        href:
          type: string
          format: uri-reference
          examples: ['/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6']
        title:
          type: string
          description: Beschriftung für Menschen – etwa für einen Knopf
          examples: ['Konto deaktivieren']

    CustomerLinks:
      type: object
      description: |
        Was von diesem Kunden aus möglich ist. **Die Auswahl hängt vom Zustand
        ab** – und genau das ist der Gewinn: Der Client muss die Regel nicht
        kennen, er liest sie ab.

        | `state` | vorhandene Beziehungen |
        | ------- | ---------------------- |
        | `aktiv` | `self`, `address`, `payments`, `deactivate`, `lock` |
        | `deaktiviert` | `self`, `address`, `payments`, `activate`, `lock` |
        | `gesperrt` | `self`, `address`, `payments`, `unlock` |

        Ein gesperrtes Konto lässt sich **nicht** deaktivieren, deshalb fehlt der
        Verweis. Ein deaktiviertes lässt sich sehr wohl sperren, deshalb ist
        `lock` dort vorhanden.

        **Und die Methode?** Steht nicht im Link. `deactivate` und `activate`
        zeigen auf **dieselbe Adresse** – der eine meint `PUT`, der andere
        `DELETE`. HAL kann das nicht ausdrücken; die Bedeutung steckt allein im
        Namen der Beziehung. Wer die Methode mitliefern will, braucht ein
        reicheres Format (HAL-FORMS, Siren, JSON:API).

        Dass diese Aufstellung in Prosa steht und nicht im Schema, ist ebenfalls
        eine Grenze: OpenAPI kann „dieses Feld gibt es nur, wenn `state` gleich
        `aktiv` ist“ nicht ausdrücken, ohne das Schema in drei Varianten zu
        zerlegen.
      required: [self]
      properties:
        self:
          allOf:
            - $ref: '#/components/schemas/Link'
          description: Dieser Kunde
        address:
          allOf:
            - $ref: '#/components/schemas/Link'
          description: Die Anschrift – `GET` und `PUT`
        payments:
          allOf:
            - $ref: '#/components/schemas/Link'
          description: Die Bezahldaten – `GET`
        deactivate:
          allOf:
            - $ref: '#/components/schemas/Link'
          description: |
            Nur bei `aktiv`. **`PUT`** auf `/customers/{id}/flags/deactivation`.
        activate:
          allOf:
            - $ref: '#/components/schemas/Link'
          description: |
            Nur bei `deaktiviert`. **`DELETE`** auf dieselbe Adresse wie
            `deactivate`.
        lock:
          allOf:
            - $ref: '#/components/schemas/Link'
          description: |
            Bei `aktiv` und bei `deaktiviert`. **`PUT`** auf
            `/customers/{id}/flags/lock`.
        unlock:
          allOf:
            - $ref: '#/components/schemas/Link'
          description: |
            Nur bei `gesperrt`. **`DELETE`** auf dieselbe Adresse wie `lock`.

    HalCustomer:
      description: |
        Derselbe Kunde wie unter `application/json`, ergänzt um `_links`.
        Angefordert wird er über den Medientyp – die alte Darstellung bleibt
        unverändert bestehen.
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          required: [_links]
          properties:
            _links:
              allOf:
                - $ref: '#/components/schemas/CustomerLinks'
              readOnly: true
      examples:
        - id: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
          name: 'Tom Mayer'
          birthdate: '1985-07-14'
          state: 'aktiv'
          _links:
            self: { href: '/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6' }
            address: { href: '/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6/address' }
            payments: { href: '/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6/payments' }
            deactivate:
              href: '/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6/flags/deactivation'
              title: 'Konto deaktivieren'
            lock:
              href: '/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6/flags/lock'
              title: 'Konto sperren'
        - id: '9c1f2b0a-1111-4562-b3fc-2c963f66afa6'
          name: 'Mia Wolf'
          birthdate: '1990-02-03'
          state: 'deaktiviert'
          _links:
            self: { href: '/customers/9c1f2b0a-1111-4562-b3fc-2c963f66afa6' }
            address: { href: '/customers/9c1f2b0a-1111-4562-b3fc-2c963f66afa6/address' }
            payments: { href: '/customers/9c1f2b0a-1111-4562-b3fc-2c963f66afa6/payments' }
            activate:
              href: '/customers/9c1f2b0a-1111-4562-b3fc-2c963f66afa6/flags/deactivation'
              title: 'Konto wieder aktivieren'
            lock:
              href: '/customers/9c1f2b0a-1111-4562-b3fc-2c963f66afa6/flags/lock'
              title: 'Konto sperren'
        - id: '5e7d3c99-2222-4562-b3fc-2c963f66afa6'
          name: 'Jan Krause'
          birthdate: '1978-11-30'
          state: 'gesperrt'
          _links:
            self: { href: '/customers/5e7d3c99-2222-4562-b3fc-2c963f66afa6' }
            address: { href: '/customers/5e7d3c99-2222-4562-b3fc-2c963f66afa6/address' }
            payments: { href: '/customers/5e7d3c99-2222-4562-b3fc-2c963f66afa6/payments' }
            unlock:
              href: '/customers/5e7d3c99-2222-4562-b3fc-2c963f66afa6/flags/lock'
              title: 'Sperre aufheben'

    HalCustomerCollection:
      type: object
      description: |
        Die Kundenliste als HAL-Dokument. Die Einträge stehen unter
        `_embedded.customers`, nicht unter `items` – so schreibt es HAL vor.

        **Der `next`-Verweis ist der unauffälligste Hypermedia-Gewinn und der
        nützlichste:** Statt den Cursor selbst an die Adresse zu hängen, folgt
        der Client einfach dem Link. Fehlt er, ist die Liste zu Ende. Genau das
        bauen viele APIs ganz selbstverständlich ein, ohne es Hypermedia zu
        nennen.
      required: [_links, _embedded]
      properties:
        _links:
          type: object
          required: [self]
          properties:
            self:
              $ref: '#/components/schemas/Link'
            next:
              allOf:
                - $ref: '#/components/schemas/Link'
              description: |
                Die nächste Seite, Cursor bereits eingebaut. **Fehlt dieser
                Verweis, war es die letzte Seite** – der Client braucht
                `nextCursor` nicht mehr auszuwerten.
        _embedded:
          type: object
          required: [customers]
          properties:
            customers:
              type: array
              items:
                $ref: '#/components/schemas/HalCustomer'
      examples:
        - _links:
            self: { href: '/customers?limit=50' }
            next: { href: '/customers?limit=50&cursor=eyJhZnRlciI6IjkxYzAxZjIzIn0' }
          _embedded:
            customers:
              - id: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
                name: 'Tom Mayer'
                birthdate: '1985-07-14'
                state: 'aktiv'
                _links:
                  self: { href: '/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6' }
                  deactivate: { href: '/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6/flags/deactivation' }
                  lock: { href: '/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6/flags/lock' }

    Address:
      type: object
      required: [street, zip, city]
      properties:
        street:
          type: string
          minLength: 3
          maxLength: 100
        number:
          type: string
          maxLength: 10
        zip:
          type: string
          pattern: '^[0-9]{5}$'
          description: Fünfstellig – diese API bildet nur deutsche Anschriften ab.
        city:
          type: string
          minLength: 1
          maxLength: 100

    PayPal:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 100

    CreditCard:
      type: object
      required: [number, validity]
      properties:
        number:
          type: string
          minLength: 8
          maxLength: 19
          description: Wird beim Lesen maskiert zurückgegeben.
        validity:
          type: string
          pattern: '^[0-9]{2}/[0-9]{2}$'
          examples: ['09/28']
        cvc:
          type: string
          pattern: '^[0-9]{3}$'
          writeOnly: true
          description: Wird nie zurückgegeben.

    PaymentOverview:
      type: object
      description: Welche Bezahlarten hinterlegt sind
      properties:
        paypal:
          $ref: '#/components/schemas/PayPal'
        creditcard:
          $ref: '#/components/schemas/CreditCard'

    DeactivationFlag:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
          description: Optionaler Grund der Deaktivierung
        since:
          type: string
          format: date-time
          readOnly: true

    LockFlag:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
          description: Optionaler Grund der Sperre
          examples: ['Zahlungsrückstand']
        since:
          type: string
          format: date-time
          readOnly: true

    Problem:
      type: object
      description: |
        Fehlerformat nach **RFC 9457** (*Problem Details for HTTP APIs*),
        Medientyp `application/problem+json`.

        Der Gewinn gegenüber einem eigenen Format: Ein Client, der schon einmal
        eine Problem-Details-Antwort verarbeitet hat, versteht auch diese. Und
        Werkzeuge – Gateways, Bibliotheken, Logging – kennen sie ohnehin.

        Was **nicht** hineingehört: Stacktraces, Klassennamen, SQL-Fragmente,
        Pfade. Eine Fehlerantwort geht nach außen.
      properties:
        type:
          type: string
          format: uri
          description: |
            Die Fehlerkennung – **das einzige Feld, auf das ein Programm Logik
            bauen darf.** Eine URI, keine Zahl: Sie ist eindeutig, auch wenn
            zwei Dienste denselben Statuscode benutzen.
          default: 'about:blank'
          examples: ['https://api.example.com/problems/validation-error']
        title:
          type: string
          description: Kurze Beschreibung für Menschen; darf sich ändern.
          examples: ['Die Kundendaten sind nicht gültig']
        status:
          type: integer
          description: |
            Derselbe Code wie in der Statuszeile. Redundant, und trotzdem
            nützlich: Er bleibt erhalten, wenn die Antwort weitergereicht oder
            protokolliert wird.
          examples: [400]
        detail:
          type: string
          description: Beschreibung dieses konkreten Falls; darf sich ändern.
          examples: ['2 Felder sind fehlerhaft.']
        instance:
          type: string
          format: uri-reference
          description: Worauf sich der Fehler bezieht
          examples: ['/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6']

    ValidationProblem:
      description: |
        Ein Problem Details mit einem **eigenen Feld**. Genau dafür ist RFC 9457
        gebaut: Das Format ist erweiterbar, ohne dass es aufhört, Standard zu
        sein – wer `errors` nicht kennt, liest trotzdem `type` und `title`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              description: |
                **Alle** fehlerhaften Felder auf einmal – sonst braucht der
                Aufrufer mehrere Anläufe.
              items:
                type: object
                properties:
                  field:
                    type: string
                    examples: ['name']
                  message:
                    type: string
                    examples: ['mindestens 3 Zeichen']

  securitySchemes:
    openId:
      type: oauth2
      description: |
        **Im Kurs nicht behandelt.** Authentifizierung und Autorisierung erledigt
        üblicherweise das API Gateway *vor* dem Service – im Code der
        Implementierung steht davon nichts. Hier nur, damit die Beschreibung
        vollständig ist und man sieht, welche Berechtigung welche Operation
        verlangt.

        Die Berechtigungen sind bewusst **grob geschnitten**: lesen, schreiben,
        Bezahldaten und Sperren getrennt. Genau deshalb liegen die Bezahldaten
        als eigene Subressourcen und nicht als Felder des Kunden – eine
        Berechtigung auf Feldebene kann HTTP nicht ausdrücken.

        `lock_access` ist ein eigener Scope, weil die Sperre ein anderer Vorgang
        ist als eine Änderung am Kunden: Sie gehört dem Betreiber, nicht dem
        Kundenservice. Wer nur `writer_access` hat, kann Namen ändern – sperren
        kann er nicht.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes:
            reader_access: Kundendaten lesen
            writer_access: Kundendaten anlegen, ändern und löschen
            payment_access: Bezahldaten lesen und ändern
            lock_access: Konten sperren und entsperren
